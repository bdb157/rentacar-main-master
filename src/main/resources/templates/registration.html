<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>UpiżCARS</title>
    <link rel="stylesheet" th:href="@{/css/registration.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/ikona.ico}">
</head>
<body>
<div id="all">
    <div id="menu">
        <ul>
            <li><a href="/">Strona główna</a></li>
            <li><a href="/accessible">Dostępne samochody</a></li>
            <li><a href="/registration">Rejestracja</a></li>
            <li><a href="/rent">Wypożycz</a></li>
        </ul>
    </div>
    <div id="article">
        <h1>Zarejestruj się w bazie klientów, aby wypożyczyć samochód! </h1>
        <div id="wypozycz">
            <form action="/process_registration" method="post">
                <label for="name">Pesel:</label>
                <input type="text" id="pesel" name="pesel" required>
                <label for="name">Imię:</label>
                <input type="text" id="first_name" name="first_name" required>
                <label for="name">Nazwisko:</label>
                <input type="text" id="last_name" name="last_name" required>
                <label for="name">Adres:</label>
                <input type="text" id="address" name="address" required>
                <label for="phone">Numer Telefonu:</label>
                <input type="tel" id="phone_number" name="phone_number" required>
                <label for="phone">E-mail:</label>
                <input type="tel" id="email" name="email" required>
                <button type="submit">Zarejestruj i przejdź dalej</button>
            </form>
        </div>
    </div>
    <div id="footer">
        <p> @2025 - Wszelkie prawa zastrzeżone.</p>
        <p> Projekt wykonali:<br> Łukasz Tomczyk <br> Michał Wojtachnio<br> Bartłomiej Sobieraj<br> Piotr Socha</p>
    </div>
</div>
</body>
</html>
